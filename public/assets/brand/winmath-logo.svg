<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 154" role="img" aria-labelledby="title description">
  <title id="title">WinMath</title>
  <desc id="description">WinMath wordmark with an illuminated mathematical root symbol.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4BD"/>
      <stop offset="0.42" stop-color="#FFD558"/>
      <stop offset="1" stop-color="#E48A08"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4DFA5"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D1C45"/>
      <stop offset="1" stop-color="#210A2F"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dy="7" result="offset"/>
      <feColorMatrix in="offset" values="0 0 0 0 0.08 0 0 0 0 0.015 0 0 0 0 0.02 0 0 0 .85 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="16" y="20" width="112" height="112" rx="28" fill="url(#tile)" stroke="url(#gold)" stroke-width="5"/>
    <path d="M35 79h18l13 28 24-66h30" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="45" r="4.5" fill="#FFF4BD" filter="url(#glow)"/>
    <circle cx="108" cy="109" r="4.5" fill="#FFF4BD" filter="url(#glow)"/>

    <text x="151" y="103" font-family="Arial Black, Arial, sans-serif" font-size="75" font-weight="900" letter-spacing="-5" fill="url(#gold)" stroke="#6D2708" stroke-width="2" paint-order="stroke fill">WIN</text>
    <text x="307" y="103" font-family="Arial Black, Arial, sans-serif" font-size="75" font-weight="900" letter-spacing="-5" fill="url(#ivory)" stroke="#6D2708" stroke-width="2" paint-order="stroke fill">MATH</text>
    <path d="M157 119h419" stroke="#F7B51A" stroke-width="3" stroke-linecap="round" opacity=".82"/>
    <text x="160" y="143" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="7.5" fill="#FFE7A3">PROBABILITY IN MOTION</text>
  </g>
</svg>
